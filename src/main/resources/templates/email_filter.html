<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Фильтр Email</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; }
            .container { max-width: 600px; }
            textarea { width: 100%; height: 150px; margin-bottom: 10px; }
            .result { background-color: #f4f4f4; padding: 15px; border: 1px solid #ccc; margin-top: 20px; }
            .error { color: red; }
        </style>
    </head>

    <body>
        <div class="container">
            <!-- Кнопка Назад -->
            <a href="/" class="back-btn">← На главную</a>

            <h2>Обработка списка Email</h2>
            <h4>Из переданного текста, содержащего Email-адреса<br> формирует спискок уникальных Email</h4>

            <!-- Форма отправки данных -->
            <form action="/tools/email-filter/name" method="POST">
                <label for="emails">Вставьте email-адреса:</label><br>
                <textarea id="emails" name="emails" th:text="${rawEmails}"></textarea>

                <!-- Поле для исключаемых адресов -->
                <label for="excludeEmails">Исключить адреса (<i>по одному в строке или через запятую/пробел</i>):</label><br>
                <textarea id="excludeEmails" name="excludeEmails" style="height: 80px;" th:text="${excludeEmails}"></textarea>

                <!-- Выбор вида вывода -->
                <fieldset style="margin-bottom: 10px;">
                    <legend>Вид вывода:</legend>
                    <label>
                        <input type="radio" name="outputMode" value="plain"
                               th:checked="${outputMode == 'plain'}">
                        Без разделения.
                    </label><br>
                    <label>
                        <input type="radio" name="outputMode" value="blocks10"
                               th:checked="${outputMode == null or outputMode == 'blocks10'}">
                        Блоки по 10 шт.
                    </label><br>
                    <label>
                        <input type="radio" name="outputMode" value="blocks10_50_100"
                               th:checked="${outputMode == 'blocks10_50_100'}">
                        Блоки по 10 шт.; каждые 50 → 3 пропуска, каждые 100 → 10 пропусков.
                    </label><br>
                    <label>
                        <input type="radio" name="outputMode" value="domains"
                               th:checked="${outputMode == 'domains'}">
                        Разносить только по доменам.
                    </label>
                </fieldset>

                <!-- Три кнопки в один ряд -->
                <div style="margin-bottom: 10px;">
                    <button type="submit" formaction="/tools/email-filter/without">Без фильтрации</button>
                    <button type="submit">Фильтр по имени</button>
                    <button type="submit" formaction="/tools/email-filter/domain-and-name">Фильтр по домену и имени</button>
                    <button type="button" onclick="document.getElementById('emails').value = '';">Очистить</button>
                </div>
            </form>

            <!-- Блок для вывода ошибки, если она есть -->
            <div class="error" th:if="${error}" th:text="${error}"></div>

            <!-- Блок для вывода результата -->
            <div class="result" th:if="${itemsFound != null and itemsFound > 0}">
                <p><strong>Очищенный список <b>Email</b> - адресов <i>(<span th:text="${itemsFound}"></span> шт.)</i>:</strong></p>
                <div style="font-family: monospace;">
                    <div th:each="line : ${filteredEmails}">
                        <th:block th:if="${!#strings.isEmpty(line)}" th:text="${line} + ','"></th:block>
                        <th:block th:if="${#strings.isEmpty(line)}">&nbsp;</th:block>
                    </div>
                </div>
            </div>

            <!-- Если после фильтрации ничего не осталось -->
            <div class="result" th:if="${itemsFound != null and itemsFound == 0}">
                Валидных email-адресов не найдено.
            </div>

            <div style="margin-top: 40px; padding-top: 15px; border-top: 1px dashed #ccc; text-align: center; font-size: 14px;">
                <a href="/about" style="color: #888; text-decoration: none;">О приложении и авторе</a>
            </div>
        </div>
    </body>
</html>
