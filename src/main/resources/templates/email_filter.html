<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Фильтр Email</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; }
        .result { background-color: #f4f4f4; padding: 15px; border: 1px solid #ccc; margin-top: 20px; white-space: pre-wrap; }
        .error { color: red; }
    </style>
</head>

<body>
<div class="container">
    <!-- Кнопка Назад -->
    <a href="/" class="back-btn">← На главную</a>

    <h2>Обработка списка Email</h2>
    <h4>Из переданного текста, содержащего Email-адреса<br> формирует спискок уникальных Email</h4>

    <!-- Форма отправки данных -->
    <form action="/tools/email-filter/name" method="POST">
        <label for="emails">Вставьте email-адреса:</label><br>
        <textarea id="emails" name="emails" th:text="${rawEmails}"></textarea>

        <!-- Три кнопки в один ряд -->
        <div style="margin-bottom: 10px;">
            <button type="submit" formaction="/tools/email-filter/without">Без фильтрации</button>
            <button type="submit">Фильтр по имени</button>
            <button type="submit" formaction="/tools/email-filter/domain-and-name">Фильтр по домену и имени</button>
            <button type="button" onclick="document.getElementById('emails').value = '';">Очистить</button>
        </div>
    </form>

    <!-- Блок для вывода ошибки, если она есть -->
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <!-- Блок для вывода результата -->
    <div class="result" th:if="${filteredEmails != null and !filteredEmails.isEmpty()}">
        <p><strong>Очищенный список <b>Email</b> - адресов <i>(<span th:text="${#lists.size(filteredEmails)}"></span> шт.)</i>:</strong></p>
        <table style="border-collapse: collapse; font-family: monospace;">
            <th:block th:each="email, iter : ${filteredEmails}">
                <tr>
                    <td th:text="${email} + ','"></td>
                </tr>

                <!-- Каждые 100 элементов - 10 пустых строк -->
                <th:block th:if="${iter.index % 100 == 99}">
                    <tr th:each="i : ${#numbers.sequence(1, 10)}"><td>&nbsp;</td></tr>
                </th:block>

                <!-- Каждые 50 элементов (но не 100) - 3 пустые строки -->
                <th:block th:if="${iter.index % 50 == 49 and iter.index % 100 != 99}">
                    <tr th:each="i : ${#numbers.sequence(1, 3)}"><td>&nbsp;</td></tr>
                </th:block>

                <!-- Каждые 10 элементов (но не 50 и не 100) - 1 пустая строка -->
                <tr th:if="${iter.index % 10 == 9 and iter.index % 50 != 49}">
                    <td>&nbsp;</td>
                </tr>
            </th:block>
        </table>
    </div>

    <!-- Если после фильтрации ничего не осталось -->
    <div class="result" th:if="${filteredEmails != null and filteredEmails.isEmpty()}">
        Валидных email-адресов не найдено.
    </div>
</div>
</body>
</html>
