<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mailing Utils</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 15px; }
        a { text-decoration: none; color: #007bff; font-size: 18px; }
        a:hover { text-decoration: underline; }

        .stop-btn {
            background-color: #dc3545; color: white; border: none;
            padding: 10px 20px; font-size: 16px; border-radius: 4px;
            cursor: pointer; margin-top: 30px;
        }
        .stop-btn:hover { background-color: #c82333; }
    </style>
</head>

<body>
<h1>Contact data parser</h1>
<h2><b>ПАРСЕР КОНТАКТОВ</b> - главная страница</h2>
<br>
<ul>
    <li><a href="/tools/email-filter">→ Парсинг <b>Email-адресов</b></a></li>
    <li><a href="/tools/telegram-filter">→ Парсинг <b>Telegram-профилей</b></a></li>
    <li><a href="/tools/phone-filter">→ Парсинг <b>телефонных номеров</b></a></li>
</ul>

<!-- Кнопка остановки (завершение приложения) -->
<button class="stop-btn" onclick="stopApp()"><b>🛑 STOP</b> - Остановить приложение (<i>освободить порт</i>)</button>

<!-- Подвал со ссылкой на автора -->
<div style="margin-top: 50px; padding-top: 20px; border-top: 1px solid #eee; font-size: 14px; color: #666;">
    <a href="/about" style="color: #666; text-decoration: none;">О проекте и авторе</a> |
    Yury ❤️ Laboratory
</div>

<script>
    function stopApp() {
        if (!confirm('Вы уверены, что хотите остановить приложение? Порт 54321 будет освобожден.')) {
            return;
        }

        fetch('/actuator/shutdown', { method: 'POST' })
            .then(response => {
                if (response.ok) {
                    document.body.innerHTML = '<h2 style="color: red; text-align: center; margin-top: 100px;">Приложение успешно остановлено. Порт свободен. Можно закрыть страницу.</h2>';
                } else {
                    alert('Не удалось остановить приложение. Проверьте, включен ли эндпоинт shutdown.');
                }
            })
            .catch(error => {
                document.body.innerHTML = '<h2 style="color: red; text-align: center; margin-top: 100px;">Приложение остановлено (соединение прервано).</h2>';
            });
    }
</script>
</body>
</html>
